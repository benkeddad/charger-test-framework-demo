name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # Nightly at 2 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  smoke:
    name: Smoke Tests (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Lint with ruff
        run: ruff check .
      
      - name: Run smoke tests
        run: pytest -m smoke -v
      
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: evidence-smoke-${{ github.run_number }}
          path: evidence/
          retention-days: 7
          if-no-files-found: ignore

  full:
    name: Full Test Suite (Nightly/Manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Lint with ruff
        run: ruff check .
      
      - name: Run full test suite
        run: pytest -v
      
      - name: Generate trace report
        run: |
          python tools/trace_report.py --fail-on-uncovered
      
      - name: Check for flaky tests
        run: |
          python tools/flake_check.py 5
      
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: evidence-full-${{ github.run_number }}
          path: evidence/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload trace report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trace-report-${{ github.run_number }}
          path: trace.md
          retention-days: 30
          if-no-files-found: ignore
